<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internship Application Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Internship Application Form</h1>

    <form action="#" method="post" enctype="multipart/form-data">

        <!-- Personal Details -->
        <fieldset>
            <legend>Personal Details</legend>

            <label for="fullName">Full Name:</label>
            <input
                type="text"
                id="fullName"
                name="fullName"
                placeholder="Enter your full name"
                required
            >
            <br><br>

            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >
            <br><br>

            <label for="phone">Phone:</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                required
            >
            <br><br>

            <label for="dob">Date of Birth:</label>
            <input
                type="date"
                id="dob"
                name="dob"
                required
            >
            <br><br>

            <label for="password">Password:</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >
        </fieldset>

        <br>

        <!-- Gender -->
        <fieldset>
            <legend>Gender</legend>

            <input type="radio" id="male" name="gender" value="Male" required>
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label>
        </fieldset>

        <br>

        <!-- Education -->
        <fieldset>
            <legend>Educational Details</legend>

            <label for="course">Course:</label>

            <select id="course" name="course" required>
                <option value="">-- Select Course --</option>
                <option value="CSE">CSE</option>
                <option value="IT">IT</option>
                <option value="ECE">ECE</option>
                <option value="Mechanical">Mechanical</option>
            </select>
        </fieldset>

        <br>

        <!-- Skills -->
        <fieldset>
            <legend>Skills</legend>

            <input type="checkbox" id="java" name="skills" value="Java">
            <label for="java">Java</label>

            <input type="checkbox" id="javascript" name="skills" value="JavaScript">
            <label for="javascript">JavaScript</label>

            <input type="checkbox" id="html" name="skills" value="HTML">
            <label for="html">HTML</label>

            <input type="checkbox" id="css" name="skills" value="CSS">
            <label for="css">CSS</label>

            <input type="checkbox" id="react" name="skills" value="React">
            <label for="react">React</label>
        </fieldset>

        <br>

        <!-- Internship Preference -->
        <fieldset>
            <legend>Internship Preference</legend>

            <input
                type="radio"
                id="workFromOffice"
                name="internshipPreference"
                value="Work From Office"
                required
            >
            <label for="workFromOffice">Work From Office</label>

            <input
                type="radio"
                id="remote"
                name="internshipPreference"
                value="Remote"
            >
            <label for="remote">Remote</label>

            <input
                type="radio"
                id="hybrid"
                name="internshipPreference"
                value="Hybrid"
            >
            <label for="hybrid">Hybrid</label>
        </fieldset>

        <br>

        <!-- Resume -->
        <fieldset>
            <legend>Application Details</legend>

            <label for="resume">Upload Resume:</label>
            <input
                type="file"
                id="resume"
                name="resume"
                accept=".pdf,.doc,.docx"
                required
            >
            <br><br>

            <label for="coverLetter">Cover Letter:</label>
            <br>

            <textarea
                id="coverLetter"
                name="coverLetter"
                rows="8"
                cols="50"
                placeholder="Write your cover letter here..."
                required
            ></textarea>
        </fieldset>

        <br>

        <!-- Buttons -->
        <input type="submit" value="Submit Application">
        <input type="reset" value="Reset Form">

    </form>

</body>
</html>
