<!DOCTYPE html>
<html>
<head>
    <title>Simple Form</title>
</head>
<body>

<h2>Student Form</h2>

<form>
    Name: <br>
    <input type="text"><br><br>

    Email: <br>

    Password: <br>

     Gender: <br>

    <input type="radio" name="gender"> Other
    <br><br>

    <input type="submit" value="Submit">
</form>

</body>
</html>
