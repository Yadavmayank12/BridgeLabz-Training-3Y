<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BENTO</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: 150px 150px 150px;
            grid-template-rows: 150px 150px 150px;
            grid-template-areas:
                "item1 item2 item2"
                "item1 item3 item4"
                "item5 item5 item6";
                grid-gap: 1rem;
        }

        .item {
            background-color: #4320a3;;
            border: 2px solid #000;
            border-radius: 2rem;
        }
        .item1 {
            background-image: linear-gradient(to top, #7a6ba5, transparent), url(./boy.png);
            background-position: center;
            background-size: cover;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item item1" style="grid-area: item1;">Item1</div>
        <div class="item item2" style="grid-area: item2;">Item2</div>
        <div class="item item3" style="grid-area: item3;">Item3</div>
        <div class="item item4" style="grid-area: item4;">Item4</div>
        <div class="item item5" style="grid-area: item5;">Item5</div>
        <div class="item item6" style="grid-area: item6;">Item6</div>
    </div>
</body>
</html>
