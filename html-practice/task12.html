<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Creative Inline Formatting</title>
</head>
<body>
    <!-- Creative combination of inline formatting elements -->
    <p>
        <strong>Today</strong> I learned something <em>new</em> about HTML.
        It was a <mark>great</mark> learning experience.<br>
        I will keep practicing and improving. <small>Keep learning!</small>
    </p>
</body>
</html>
