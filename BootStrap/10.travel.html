<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Travel Agency
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="10.travel.css" rel="stylesheet"/>
 </head>
 <body>
  <header class="py-4 text-center bg-dark text-white">
   <h1>
    WanderWise
   </h1>
   <p class="mb-0">
    Discover your next journey
   </p>
  </header>
  <main>
   <section class="carousel slide" data-bs-ride="carousel" id="travelCarousel">
    <div class="carousel-indicators">
     <button class="active" data-bs-slide-to="0" data-bs-target="#travelCarousel" type="button">
     </button>
     <button data-bs-slide-to="1" data-bs-target="#travelCarousel" type="button">
     </button>
     <button data-bs-slide-to="2" data-bs-target="#travelCarousel" type="button">
     </button>
    </div>
    <div class="carousel-inner">
     <div class="carousel-item active" data-bs-interval="3000">
      <div class="slide delhi">
       <div class="carousel-caption">
        <h2>
         Delhi
        </h2>
        <p>
         Explore history, food and culture.
        </p>
       </div>
      </div>
     </div>
     <div class="carousel-item" data-bs-interval="4000">
      <div class="slide mountains">
       <div class="carousel-caption">
        <h2>
         Himalayas
        </h2>
        <p>
         Find adventure among the mountains.
        </p>
       </div>
      </div>
     </div>
     <div class="carousel-item" data-bs-interval="5000">
      <div class="slide beach">
       <div class="carousel-caption">
        <h2>
         Goa
        </h2>
        <p>
         Relax beside beautiful beaches.
        </p>
       </div>
      </div>
     </div>
    </div>
    <button class="carousel-control-prev" data-bs-slide="prev" data-bs-target="#travelCarousel" type="button">
     <span class="carousel-control-prev-icon">
     </span>
    </button>
    <button class="carousel-control-next" data-bs-slide="next" data-bs-target="#travelCarousel" type="button">
     <span class="carousel-control-next-icon">
     </span>
    </button>
    <section class="container py-5">
     <h2>
      Booking Completion
     </h2>
     <div aria-label="Booking completion" aria-valuemax="100" aria-valuemin="0" aria-valuenow="70" class="progress" role="progressbar">
      <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width:70%">
       70%
      </div>
     </div>
    </section>
   </section>
  </main>
  <footer class="bg-dark text-white text-center py-4">
   <p class="mb-1">
    Contact: +91 98765 43210
   </p>
   <p class="mb-0">
    travel@wanderwise.example
   </p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
 </body>
</html>
