<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Product Catalog
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="03.product.css" rel="stylesheet"/>
 </head>
 <body>
  <header class="py-4 text-center bg-dark text-white">
   <h1>
    TechMart
   </h1>
   <p class="mb-0">
    Simple products for everyday technology
   </p>
  </header>
  <main class="container py-5">
   <h2 class="text-center mb-4">
    Featured Products
   </h2>
   <div class="row g-4">
    <div class="col-12 col-sm-6 col-md-3">
     <div class="card h-100 product-card shadow-sm">
      <div class="product-img">
       L
      </div>
      <div class="card-body">
       <h5>
        Wireless Lamp
       </h5>
       <p class="fw-bold">
        ₹899
       </p>
       <button class="btn btn-dark w-100">
        Add to Cart
       </button>
      </div>
     </div>
    </div>
    <div class="col-12 col-sm-6 col-md-3">
     <div class="card h-100 product-card shadow-sm">
      <div class="product-img">
       H
      </div>
      <div class="card-body">
       <h5>
        Smart Headphones
       </h5>
       <p class="fw-bold">
        ₹1,999
       </p>
       <button class="btn btn-dark w-100">
        Add to Cart
       </button>
      </div>
     </div>
    </div>
    <div class="col-12 col-sm-6 col-md-3">
     <div class="card h-100 product-card shadow-sm">
      <div class="product-img">
       K
      </div>
      <div class="card-body">
       <h5>
        Mechanical Keyboard
       </h5>
       <p class="fw-bold">
        ₹2,499
       </p>
       <button class="btn btn-dark w-100">
        Add to Cart
       </button>
      </div>
     </div>
    </div>
    <div class="col-12 col-sm-6 col-md-3">
     <div class="card h-100 product-card shadow-sm">
      <div class="product-img">
       M
      </div>
      <div class="card-body">
       <h5>
        Wireless Mouse
       </h5>
       <p class="fw-bold">
        ₹799
       </p>
       <button class="btn btn-dark w-100">
        Add to Cart
       </button>
      </div>
     </div>
    </div>
   </div>
  </main>
 </body>
</html>
