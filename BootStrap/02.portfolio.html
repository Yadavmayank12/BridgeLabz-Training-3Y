<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Personal Portfolio
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="02.portfolio.css" rel="stylesheet"/>
 </head>
 <body class="bg-light text-dark">
  <header class="text-center mt-4 mb-3">
   <h1 class="fw-bold">
    Rohit Saraswat
   </h1>
   <p class="lead">
    B.Tech Computer Science Student | Web &amp; AI Automation Enthusiast
   </p>
  </header>
  <main class="container text-center">
   <section class="p-5 bg-white rounded-4 shadow-sm">
    <div class="profile mx-auto mb-4">
     RS
    </div>
    <h2 class="fw-bold">
     Hello, I'm Mayank
    </h2>
    <p class="mb-4">
     I enjoy building useful websites, learning programming, cybersecurity and AI automation.
    </p>
    <a class="btn btn-primary me-2" href="#contact">
     Hire Me
    </a>
    <a class="btn btn-outline-dark" href="#">
     Download CV
    </a>
   </section>
   <section class="py-5" id="contact">
    <h2 class="fw-bold mb-3">
     Contact Me
    </h2>
    <form class="mx-auto contact-form text-start">
     <label class="form-label">
      Name
     </label>
     <input class="form-control mb-3" placeholder="Your name" type="text"/>
     <label class="form-label">
      Email
     </label>
     <input class="form-control mb-3" placeholder="you@example.com" type="email"/>
     <label class="form-label">
      Message
     </label>
     <textarea class="form-control mb-3" placeholder="Your message" rows="4"></textarea>
     <button class="btn btn-dark">
      Send Message
     </button>
    </form>
   </section>
  </main>
 </body>
</html>
