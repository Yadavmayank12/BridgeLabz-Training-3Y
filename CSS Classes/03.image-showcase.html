<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Image Showcase
  </title>
  <link href="03.image-showcase.css" rel="stylesheet"/>
 </head>
 <body>
  <header>
   <h1>
    Image Showcase
   </h1>
   <p>
    A responsive six-image gallery.
   </p>
  </header>
  <main class="gallery">
   <figure>
    <div class="image-wrap">
     <img alt="Mountain landscape" src="https://picsum.photos/seed/mountain/600/400"/>
     <div class="overlay">
     </div>
    </div>
    <figcaption>
     Mountain Escape
    </figcaption>
   </figure>
   <figure>
    <div class="image-wrap">
     <img alt="Ocean view" src="https://picsum.photos/seed/ocean/600/400"/>
     <div class="overlay">
     </div>
    </div>
    <figcaption>
     Ocean View
    </figcaption>
   </figure>
   <figure>
    <div class="image-wrap">
     <img alt="Forest" src="https://picsum.photos/seed/forest/600/400"/>
     <div class="overlay">
     </div>
    </div>
    <figcaption>
     Green Forest
    </figcaption>
   </figure>
   <figure>
    <div class="image-wrap">
     <img alt="City" src="https://picsum.photos/seed/city/600/400"/>
     <div class="overlay">
     </div>
    </div>
    <figcaption>
     City Lights
    </figcaption>
   </figure>
   <figure>
    <div class="image-wrap">
     <img alt="Desert" src="https://picsum.photos/seed/desert/600/400"/>
     <div class="overlay">
     </div>
    </div>
    <figcaption>
     Desert Road
    </figcaption>
   </figure>
   <figure>
    <div class="image-wrap">
     <img alt="Lake" src="https://picsum.photos/seed/lake/600/400"/>
     <div class="overlay">
     </div>
    </div>
    <figcaption>
     Quiet Lake
    </figcaption>
   </figure>
  </main>
  <footer>
   <p>
    Responsive Gallery — Assignment 8
   </p>
  </footer>
 </body>
</html>
