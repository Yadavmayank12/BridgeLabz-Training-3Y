<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Complete Mini UI
  </title>
  <link href="10.mini-ui.css" rel="stylesheet"/>
 </head>
 <body>
  <header>
   <h1>
    Study Planner
   </h1>
  </header>
  <main class="main-card">
   <section class="intro">
    <img alt="Study workspace" src="https://picsum.photos/seed/study/320/220"/>
    <div>
     <h2>
      Plan Your Session
     </h2>
     <p>
      Create a simple study task and keep your work organized.
     </p>
    </div>
   </section>
   <form>
    <label for="task">
     Task name
    </label>
    <input id="task" placeholder="Enter your task" type="text"/>
    <label for="email">
     Email
    </label>
    <input id="email" placeholder="you@example.com" type="email"/>
    <div class="form-buttons">
     <button type="submit">
      Create Task
     </button>
     <button class="reset" type="reset">
      Reset
     </button>
    </div>
   </form>
  </main>
  <footer>
   <p>
    Mini UI Layout — Assignment 8
   </p>
  </footer>
 </body>
</html>
