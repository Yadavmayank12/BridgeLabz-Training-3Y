<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Tooltip Demonstration
  </title>
  <link href="02.tooltip.css" rel="stylesheet"/>
 </head>
 <body>
  <header>
   <h1>
    CSS Tooltip Demonstration
   </h1>
  </header>
  <main class="tooltip-area">
   <section class="tooltip-card">
    <span class="icon">
     ★
    </span>
    <span class="tooltip">
     This is a star tooltip.
    </span>
    <p>
     Star
    </p>
   </section>
   <section class="tooltip-card">
    <span class="icon">
     ?
    </span>
    <span class="tooltip">
     This tooltip explains the help icon.
    </span>
    <p>
     Help
    </p>
   </section>
   <section class="tooltip-card">
    <span class="icon">
     !
    </span>
    <span class="tooltip">
     Important information appears here.
    </span>
    <p>
     Alert
    </p>
   </section>
   <section class="tooltip-card">
    <span class="icon">
     i
    </span>
    <span class="tooltip">
     Extra information is shown here.
    </span>
    <p>
     Info
    </p>
   </section>
  </main>
  <footer>
   <p>
    Hover an item to see its tooltip.
   </p>
  </footer>
 </body>
</html>
