<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Styled Button Collection
  </title>
  <link href="05.styled-buttons.css" rel="stylesheet"/>
 </head>
 <body>
  <header>
   <h1>
    Styled Button Collection
   </h1>
  </header>
  <main class="buttons">
   <button class="btn primary">
    Primary
   </button>
   <button class="btn secondary">
    Secondary
   </button>
   <button class="btn outline">
    Outline
   </button>
   <button class="btn disabled" disabled="">
    Disabled
   </button>
  </main>
  <footer>
   <p>
    Try focusing and pressing the buttons.
   </p>
  </footer>
 </body>
</html>
