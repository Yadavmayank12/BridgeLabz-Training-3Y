<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   UI Components
  </title>
  <link href="07.ui-components.css" rel="stylesheet"/>
 </head>
 <body>
  <header>
   <h1>
    Mini UI Components
   </h1>
  </header>
  <main class="card">
   <label for="search">
    Search
   </label>
   <div class="search-row">
    <input id="search" placeholder="Search here..." type="search"/>
    <button>
     Search
    </button>
   </div>
   <label for="category">
    Category
   </label>
   <select id="category">
    <option>
     Select a category
    </option>
    <option>
     Web Design
    </option>
    <option>
     Programming
    </option>
    <option>
     Database
    </option>
   </select>
   <div class="actions">
    <button>
     Save
    </button>
    <button class="secondary">
     Cancel
    </button>
   </div>
  </main>
  <footer>
   <p>
    Responsive UI Components — Assignment 8
   </p>
  </footer>
 </body>
</html>
